name: Refresh economic data and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      deploy_current:
        description: Deploy even when no substantive dataset changes are found
        required: false
        default: false
        type: boolean

concurrency:
  group: economic-data-refresh-and-pages
  cancel-in-progress: false

permissions: {}

jobs:
  refresh-and-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pages: read
    outputs:
      data_changed: ${{ steps.changes.outputs.data_changed }}
      deploy_required: ${{ steps.decision.outputs.deploy_required }}
      deployment_commit: ${{ steps.commit.outputs.deployment_commit }}
      latest_dataset_date: ${{ steps.metadata.outputs.latest_dataset_date }}
      diagnostic_actionable: ${{ steps.diagnostic.outputs.actionable }}
      diagnostic_category: ${{ steps.diagnostic.outputs.category }}
      diagnostic_stage: ${{ steps.diagnostic.outputs.stage }}
      diagnostic_dataset: ${{ steps.diagnostic.outputs.dataset }}
      diagnostic_reason: ${{ steps.diagnostic.outputs.reason }}
      reminder_actionable: ${{ steps.reminders.outputs.actionable }}
      reminder_keys: ${{ steps.reminders.outputs.keys }}
      reminder_reason: ${{ steps.reminders.outputs.reason }}
      reminder_evaluation: ${{ steps.reminders.outcome }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Check official BLS Table 7 retrieval
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run data:refresh-inflation-contributions

      - name: Refresh economic datasets
        id: refresh
        if: github.event_name != 'push'
        run: npm run data:refresh
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Refresh international comparison datasets
        id: oecd
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run data:refresh-international

      - name: Discard retrieval-date-only rewrites
        if: github.event_name != 'push'
        shell: bash
        run: |
          while IFS= read -r file; do
            if git diff --ignore-matching-lines='^[[:space:]]*"retrievedAt":' --quiet -- "$file"; then
              git show "HEAD:$file" > "$file"
            fi
          done < <(git diff --name-only -- 'src/features/economic-series/data/*.json')

      - name: Validate refresh scope
        id: scope
        shell: bash
        run: |
          unexpected_tracked="$(git diff --name-only -- . ':(exclude)src/features/economic-series/data/*.json')"
          unexpected_untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$unexpected_tracked" || -n "$unexpected_untracked" ]]; then
            echo 'The refresh changed files outside the committed dataset directory.' >&2
            printf '%s\n%s\n' "$unexpected_tracked" "$unexpected_untracked" >&2
            exit 1
          fi

      - name: Detect substantive dataset changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- 'src/features/economic-series/data/*.json'; then
            echo 'data_changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'data_changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Test
        id: test
        run: npm test

      - name: Evaluate manual-source reminders
        if: always() && steps.install.outcome == 'success'
        id: reminders
        continue-on-error: true
        run: npm run operations:reminders -- --output .workflow-diagnostics/reminders.json --ui-output public/data-freshness.json

      - name: Check for an unresolved refresh incident
        if: github.event_name == 'push'
        id: existing_incident
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            return issues.data.some((issue) =>
              issue.title === '[Data operations] Refresh or deployment requires attention')

      - name: Preserve unresolved refresh notice
        if: steps.existing_incident.outputs.result == 'true'
        run: npm run freshness:write-refresh-failure -- --input public/data-freshness.json --output public/data-freshness.json

      - name: Install Chromium for browser smoke tests
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        id: smoke
        run: npm run test:smoke

      - name: Build GitHub Pages application
        id: build
        run: npm run build
        env:
          VITE_BASE_PATH: /economy-dashboard/

      - name: Check whitespace errors
        id: whitespace
        run: git diff --check

      - name: Decide whether deployment is required
        id: decision
        shell: bash
        env:
          DATA_CHANGED: ${{ steps.changes.outputs.data_changed }}
          DEPLOY_CURRENT: ${{ inputs.deploy_current || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == 'push' || "$DATA_CHANGED" == 'true' || "$DEPLOY_CURRENT" == 'true' ]]; then
            echo 'deploy_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit validated dataset changes
        id: commit
        shell: bash
        env:
          DATA_CHANGED: ${{ steps.changes.outputs.data_changed }}
        run: |
          if [[ "$DATA_CHANGED" == 'true' ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- 'src/features/economic-series/data/*.json'
            unexpected_staged="$(git diff --cached --name-only -- . ':(exclude)src/features/economic-series/data/*.json')"
            if [[ -n "$unexpected_staged" ]]; then
              echo 'Refusing to commit files outside the dataset directory.' >&2
              printf '%s\n' "$unexpected_staged" >&2
              exit 1
            fi
            git diff --cached --check
            git commit -m 'chore(data): automated economic data refresh'
            git push origin HEAD:main
          fi
          echo "deployment_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare Pages fallback and deployment metadata
        if: steps.decision.outputs.deploy_required == 'true'
        run: npm run pages:prepare
        env:
          DEPLOYMENT_COMMIT: ${{ steps.commit.outputs.deployment_commit }}

      - name: Read deployed dataset date
        if: steps.decision.outputs.deploy_required == 'true'
        id: metadata
        shell: bash
        run: |
          latest_date="$(node -p "require('./dist/deployment-metadata.json').latestDatasetDate")"
          echo "latest_dataset_date=$latest_date" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: steps.decision.outputs.deploy_required == 'true'
        uses: actions/configure-pages@v6

      - name: Upload validated Pages artifact
        id: pages_artifact
        if: steps.decision.outputs.deploy_required == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload manual-source reminders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-source-reminders
          path: .workflow-diagnostics/reminders.json
          if-no-files-found: warn

      - name: Classify operational diagnostics
        if: always()
        id: diagnostic
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          OECD_OUTCOME: ${{ steps.oecd.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          WHITESPACE_OUTCOME: ${{ steps.whitespace.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.pages_artifact.outcome }}
          REMINDER_OUTCOME: ${{ steps.reminders.outcome }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          category=''
          stage=''
          dataset='visible-economic-datasets'
          contracts='BEA-Q,BEA-M,BLS-EMP,BLS-CPI'
          retry='not-applicable'
          reason=''

          if [[ "$REFRESH_OUTCOME" == 'failure' ]]; then
            category='unknown-failure'; stage='retrieval'; reason='The automatic economic-data refresh failed; inspect the failed refresh step.'
          elif [[ "$OECD_OUTCOME" == 'failure' ]]; then
            category='repeated-refresh-failure'; stage='retrieval'; dataset='international-comparisons'; contracts='OECD'; retry='retries-exhausted'; reason='The OECD refresh exhausted its bounded retries; last-known-good comparison data remain deployed.'
          elif [[ "$SCOPE_OUTCOME" == 'failure' ]]; then
            category='persistence-write-failure'; stage='persistence'; reason='Refresh output escaped the permitted dataset scope.'
          elif [[ "$TEST_OUTCOME" == 'failure' || "$LINT_OUTCOME" == 'failure' || "$TYPECHECK_OUTCOME" == 'failure' || "$SMOKE_OUTCOME" == 'failure' || "$BUILD_OUTCOME" == 'failure' || "$WHITESPACE_OUTCOME" == 'failure' || "$CHROMIUM_OUTCOME" == 'failure' ]]; then
            category='verification-test-failure'; stage='verification'; reason='Repository verification prevented the refreshed or pushed revision from reaching production.'
          elif [[ "$COMMIT_OUTCOME" == 'failure' ]]; then
            category='commit-push-failure'; stage='commit-push'; reason='Validated data could not be committed or pushed.'
          elif [[ "$ARTIFACT_OUTCOME" == 'failure' ]]; then
            category='deployment-failure'; stage='deployment'; reason='The validated Pages artifact could not be prepared for deployment.'
          elif [[ "$REMINDER_OUTCOME" == 'failure' ]]; then
            category='validation-derivation-failure'; stage='validation'; dataset='manual-source-review-state'; contracts='BLS-T7,FED-RESEARCH,BEA-IRR,HOAM-M'; reason='Manual-source reminder state could not be evaluated; economic data and deployment remain isolated from this failure.'
          elif [[ "$INSTALL_OUTCOME" == 'failure' ]]; then
            category='unknown-failure'; stage='verification'; reason='Workflow dependency installation failed before diagnostics could classify a dataset operation.'
          fi

          mkdir -p .workflow-diagnostics
          if [[ -z "$category" ]]; then
            printf '{"schemaVersion":1,"diagnostics":[]}\n' > .workflow-diagnostics/report.json
            echo 'actionable=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'actionable=true' >> "$GITHUB_OUTPUT"
          echo "category=$category" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "dataset=$dataset" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          npm run diagnostics:write -- --output .workflow-diagnostics/report.json --category "$category" --stage "$stage" --dataset "$dataset" --contracts "$contracts" --retry "$retry" --reason "$reason" --workflow-url "$WORKFLOW_URL"

      - name: Upload operational diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operational-diagnostics
          path: .workflow-diagnostics/report.json
          if-no-files-found: warn

      - name: Summarize refresh and build
        if: always()
        shell: bash
        env:
          DATA_CHANGED: ${{ steps.changes.outputs.data_changed }}
          DEPLOY_REQUIRED: ${{ steps.decision.outputs.deploy_required }}
          COMMIT_SHA: ${{ steps.commit.outputs.deployment_commit }}
          LATEST_DATASET_DATE: ${{ steps.metadata.outputs.latest_dataset_date }}
        run: |
          {
            echo '## Economic data refresh and Pages build'
            echo "- Job result: ${{ job.status }}"
            echo "- Substantive dataset changes: ${DATA_CHANGED:-not determined}"
            echo "- Deployment requested: ${DEPLOY_REQUIRED:-not determined}"
            echo "- Deployment commit: ${COMMIT_SHA:-not created}"
            echo "- Latest dataset date: ${LATEST_DATASET_DATE:-not prepared}"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-failure-notice:
    needs: refresh-and-build
    if: always() && github.event_name != 'push' && needs.refresh-and-build.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deployment_commit: ${{ steps.metadata.outputs.deployment_commit }}
      latest_dataset_date: ${{ steps.metadata.outputs.latest_dataset_date }}
    steps:
      - name: Check out last committed data
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve manual-source notices
        continue-on-error: true
        run: npm run operations:reminders -- --ui-output public/data-freshness.json

      - name: Add dashboard refresh failure notice
        run: npm run freshness:write-refresh-failure -- --input public/data-freshness.json --output public/data-freshness.json

      - name: Build last-known-good application
        run: npm run build
        env:
          VITE_BASE_PATH: /economy-dashboard/

      - name: Prepare Pages fallback and deployment metadata
        run: npm run pages:prepare
        env:
          DEPLOYMENT_COMMIT: ${{ github.sha }}

      - name: Read fallback deployment metadata
        id: metadata
        shell: bash
        run: |
          echo "deployment_commit=$(node -p \"require('./dist/deployment-metadata.json').deploymentCommit\")" >> "$GITHUB_OUTPUT"
          echo "latest_dataset_date=$(node -p \"require('./dist/deployment-metadata.json').latestDatasetDate\")" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload status-only Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [refresh-and-build, prepare-failure-notice]
    if: >-
      always() &&
      ((needs.refresh-and-build.result == 'success' && needs.refresh-and-build.outputs.deploy_required == 'true') ||
      needs.prepare-failure-notice.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summarize deployment
        if: always()
        shell: bash
        env:
          VERIFIED_COMMIT: ${{ needs.refresh-and-build.outputs.deployment_commit }}
          FALLBACK_COMMIT: ${{ needs.prepare-failure-notice.outputs.deployment_commit }}
          VERIFIED_DATASET_DATE: ${{ needs.refresh-and-build.outputs.latest_dataset_date }}
          FALLBACK_DATASET_DATE: ${{ needs.prepare-failure-notice.outputs.latest_dataset_date }}
        run: |
          commit="${VERIFIED_COMMIT:-$FALLBACK_COMMIT}"
          latest_date="${VERIFIED_DATASET_DATE:-$FALLBACK_DATASET_DATE}"
          {
            echo '## GitHub Pages deployment'
            echo "- Job result: ${{ job.status }}"
            echo "- URL: ${{ steps.deployment.outputs.page_url }}"
            echo "- Commit: $commit"
            echo "- Latest dataset date: $latest_date"
            echo "- Refresh failure notice: ${{ needs.prepare-failure-notice.result == 'success' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  operational-notify:
    needs: [refresh-and-build, prepare-failure-notice, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify owner or record recovery
        uses: actions/github-script@v8
        env:
          BUILD_RESULT: ${{ needs.refresh-and-build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DIAGNOSTIC_ACTIONABLE: ${{ needs.refresh-and-build.outputs.diagnostic_actionable }}
          DIAGNOSTIC_CATEGORY: ${{ needs.refresh-and-build.outputs.diagnostic_category }}
          DIAGNOSTIC_STAGE: ${{ needs.refresh-and-build.outputs.diagnostic_stage }}
          DIAGNOSTIC_DATASET: ${{ needs.refresh-and-build.outputs.diagnostic_dataset }}
          DIAGNOSTIC_REASON: ${{ needs.refresh-and-build.outputs.diagnostic_reason }}
          REMINDER_ACTIONABLE: ${{ needs.refresh-and-build.outputs.reminder_actionable }}
          REMINDER_KEYS: ${{ needs.refresh-and-build.outputs.reminder_keys }}
          REMINDER_REASON: ${{ needs.refresh-and-build.outputs.reminder_reason }}
          REMINDER_EVALUATION: ${{ needs.refresh-and-build.outputs.reminder_evaluation }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = '[Data operations] Refresh or deployment requires attention'
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.data.find((issue) => issue.title === title)
            const buildFailed = process.env.BUILD_RESULT !== 'success'
            const deployFailed = process.env.DEPLOY_RESULT === 'failure' || process.env.DEPLOY_RESULT === 'cancelled'
            const classified = process.env.DIAGNOSTIC_ACTIONABLE === 'true'
            const refreshRun = process.env.EVENT_NAME !== 'push'
            const actionable = deployFailed || (refreshRun && (buildFailed || classified))

            if (!actionable) {
              if (refreshRun && existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Recovered: the refresh/build and applicable Pages deployment completed successfully.\n\nRun: ${process.env.WORKFLOW_URL}`,
                })
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                })
              }
            } else {
              const category = deployFailed
                ? 'deployment-failure'
                : process.env.DIAGNOSTIC_CATEGORY || 'unknown-failure'
              const stage = deployFailed
                ? 'deployment'
                : process.env.DIAGNOSTIC_STAGE || 'unknown'
              const dataset = process.env.DIAGNOSTIC_DATASET || 'visible-economic-datasets'
              const reason = deployFailed
                ? 'A verified Pages artifact did not deploy successfully; the previously deployed site remains available.'
                : process.env.DIAGNOSTIC_REASON || 'The workflow failed before a more specific diagnostic could be produced.'
              const fingerprint = `${category}|${stage}|${dataset}|${reason}`
              const marker = `<!-- diagnostic:${fingerprint} -->`
              const body = `${marker}\n### Action required\n\n- **Affected data:** ${dataset}\n- **Category:** ${category}\n- **Stage:** ${stage}\n- **Production:** Last-known-good data remain deployed; inspect freshness before assuming they are current.\n- **Automatic retry:** The next scheduled run will retry provider work; code/configuration failures require investigation.\n- **Owner action:** Ask an agent to inspect the linked run and structured \`operational-diagnostics\` artifact.\n- **Reason:** ${reason}\n- **Workflow:** ${process.env.WORKFLOW_URL}`

              if (!existing) {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body })
              } else if (!existing.body?.includes(marker)) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                })
              }
            }

            const reminderTitle = '[Data operations] Manual source review required'
            const reminderIssue = issues.data.find((issue) => issue.title === reminderTitle)
            const reminderActionable = process.env.REMINDER_ACTIONABLE === 'true'
            const reminderEvaluated = process.env.REMINDER_EVALUATION === 'success'
            if (reminderEvaluated && !reminderActionable && reminderIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: reminderIssue.number,
                body: `Completed: no manual-source reminder remains outstanding.\n\nRun: ${process.env.WORKFLOW_URL}`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: reminderIssue.number,
                state: 'closed',
                state_reason: 'completed',
              })
            } else if (reminderActionable) {
              const reminderMarker = `<!-- reminder:${process.env.REMINDER_KEYS} -->`
              const reminderBody = `${reminderMarker}\n### Manual action required\n\n${process.env.REMINDER_REASON}\n\nThis is a planned source-review or ingestion responsibility, not a system failure. Follow \`docs/data-operations.md\` and inspect the \`manual-source-reminders\` artifact.\n\nWorkflow: ${process.env.WORKFLOW_URL}`
              if (!reminderIssue) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: reminderTitle,
                  body: reminderBody,
                })
              } else if (!reminderIssue.body?.includes(reminderMarker)) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: reminderIssue.number,
                  body: reminderBody,
                })
              }
            }
